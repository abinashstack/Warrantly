name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Breaking Changes"
    labels: ["breaking"]
  - title: "Features"
    labels: ["feature", "enhancement"]
  - title: "Bug Fixes"
    labels: ["bug", "fix"]
  - title: "Security"
    labels: ["security"]
  - title: "Documentation"
    labels: ["documentation"]
  - title: "Dependencies"
    labels: ["dependencies"]
  - title: "Infrastructure"
    labels: ["ci", "infrastructure"]
version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["feature", "enhancement"]
  default: patch
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
